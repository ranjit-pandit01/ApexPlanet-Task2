<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexPlanet - Task 2 (Login & Register)</title>
    <!-- Bootstrap 5 CSS CDN (Design ke liye) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts aur Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Apni alag CSS file ko link kiya -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row w-100 justify-content-center">
            
            <!-- LOGIN FORM CARD -->
            <div class="col-12 col-md-5 m-3">
                <div class="card p-4 custom-card">
                    <h3 class="text-center mb-4 text-primary">Login</h3>
                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="Enter email">
                            <div class="error-msg" id="loginEmailError"></div>
                        </div>
                        <div class="mb-3 position-relative">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="Enter password">
                            <i class="bi bi-eye-slash password-toggle" id="toggleLoginPassword"></i>
                            <div class="error-msg" id="loginPassError"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    </form>
                </div>
            </div>

            <!-- REGISTRATION FORM CARD -->
            <div class="col-12 col-md-5 m-3">
                <div class="card p-4 custom-card">
                    <h3 class="text-center mb-4 text-success">Register</h3>
                    <form id="registerForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="regUsername" class="form-control" placeholder="Choose username">
                            <div class="error-msg" id="usernameError"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="regEmail" class="form-control" placeholder="Enter email">
                            <div class="error-msg" id="regEmailError"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="regPassword" class="form-control" placeholder="Create password">
                            <div class="error-msg" id="regPassError"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Confirm password">
                            <div class="error-msg" id="regConfirmPassError"></div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create Account</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Apni alag JS file ko link kiya -->
    <script src="script.js"></script>
</body>
</html>
